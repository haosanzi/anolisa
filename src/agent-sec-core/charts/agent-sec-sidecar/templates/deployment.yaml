{{- include "agent-sec-sidecar.validateValues" . }}
{{- $dataAccessConfig := include "agent-sec-sidecar.effectiveDataAccessModes" . | fromJson }}
{{- $dataAccessModes := get $dataAccessConfig "accessModes" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-sec-sidecar.fullname" . }}
  labels:
    {{- include "agent-sec-sidecar.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if eq .Values.runtime.volume.type "persistentVolumeClaim" }}
    type: Recreate
    rollingUpdate: null
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      {{- if and .Values.persistence.enabled (not (has "ReadWriteMany" $dataAccessModes)) }}
      maxSurge: 0
      maxUnavailable: 1
      {{- else }}
      maxSurge: 1
      maxUnavailable: 0
      {{- end }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "agent-sec-sidecar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent-sec-sidecar.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent-sec-cli
          image: "{{ .Values.cli.image.repository }}:{{ .Values.cli.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.cli.image.pullPolicy }}
          stdin: {{ .Values.cli.stdin }}
          tty: {{ .Values.cli.tty }}
          {{- with .Values.cli.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cli.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: AGENT_SEC_DAEMON_SOCKET
              value: {{ include "agent-sec-sidecar.socketPath" . | quote }}
            - name: AGENT_SEC_MODEL_SERVICE_BACKEND
              value: {{ .Values.modelService.backend | quote }}
            - name: AGENT_SEC_MODEL_SERVICE_BASE_URL
              value: {{ .Values.modelService.baseUrl | quote }}
            - name: AGENT_SEC_MODEL_SERVICE_TIMEOUT
              value: {{ .Values.modelService.timeoutSeconds | quote }}
            {{- if .Values.persistence.enabled }}
            - name: AGENT_SEC_DATA_DIR
              value: {{ include "agent-sec-sidecar.dataPath" . | quote }}
            {{- if .Values.cli.qoder.persistentPaths.enabled }}
            - name: HOME
              value: {{ .Values.persistence.mountPath | quote }}
            - name: QODER_CONFIG_DIR
              value: {{ include "agent-sec-sidecar.qoderConfigPath" . | quote }}
            - name: QODER_WORKING_DIR
              value: {{ include "agent-sec-sidecar.qoderWorkspacePath" . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.cli.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.cli.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.cli.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: {{ .Values.runtime.mountPath | quote }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
        - name: agent-sec-daemon
          image: "{{ .Values.daemon.image.repository }}:{{ .Values.daemon.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.daemon.image.pullPolicy }}
          {{- with .Values.daemon.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.daemon.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: AGENT_SEC_DAEMON_SOCKET
              value: {{ include "agent-sec-sidecar.socketPath" . | quote }}
            {{- if .Values.persistence.enabled }}
            - name: AGENT_SEC_DATA_DIR
              value: {{ include "agent-sec-sidecar.dataPath" . | quote }}
            - name: HOME
              value: {{ .Values.persistence.mountPath | quote }}
            - name: XDG_CACHE_HOME
              value: {{ printf "%s/cache" (trimSuffix "/" .Values.persistence.mountPath) | quote }}
            - name: XDG_CONFIG_HOME
              value: {{ printf "%s/config" (trimSuffix "/" .Values.persistence.mountPath) | quote }}
            - name: XDG_DATA_HOME
              value: {{ printf "%s/data" (trimSuffix "/" .Values.persistence.mountPath) | quote }}
            {{- else }}
            - name: HOME
              value: /tmp/agent-sec-home
            - name: XDG_CACHE_HOME
              value: /tmp/agent-sec-cache
            - name: XDG_CONFIG_HOME
              value: /tmp/agent-sec-config
            - name: XDG_DATA_HOME
              value: /tmp/agent-sec-data
            {{- end }}
            - name: AGENT_SEC_MODEL_SERVICE_BACKEND
              value: {{ .Values.modelService.backend | quote }}
            - name: AGENT_SEC_MODEL_SERVICE_BASE_URL
              value: {{ .Values.modelService.baseUrl | quote }}
            - name: AGENT_SEC_MODEL_SERVICE_TIMEOUT
              value: {{ .Values.modelService.timeoutSeconds | quote }}
            {{- with .Values.daemon.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.daemon.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.daemon.resources | nindent 12 }}
          volumeMounts:
            - name: runtime
              mountPath: {{ .Values.runtime.mountPath | quote }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
          {{- if .Values.daemon.probes.startup.enabled }}
          startupProbe:
            exec:
              command:
                - /usr/local/bin/agent-sec-daemon-health
            initialDelaySeconds: {{ .Values.daemon.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.daemon.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.daemon.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.daemon.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.daemon.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/agent-sec-daemon-health
            initialDelaySeconds: {{ .Values.daemon.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.daemon.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.daemon.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.daemon.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.daemon.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/agent-sec-daemon-health
            initialDelaySeconds: {{ .Values.daemon.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.daemon.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.daemon.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.daemon.probes.liveness.failureThreshold }}
          {{- end }}
        {{- if .Values.ollama.enabled }}
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          env:
            - name: OLLAMA_HOST
              value: {{ .Values.ollama.host | quote }}
            - name: OLLAMA_KEEP_ALIVE
              value: {{ .Values.ollama.keepAlive | quote }}
            - name: OLLAMA_FLASH_ATTENTION
              value: {{ ternary "1" "0" .Values.ollama.flashAttention | quote }}
            - name: OLLAMA_KV_CACHE_TYPE
              value: {{ .Values.ollama.kvCacheType | quote }}
            - name: OLLAMA_MODEL
              value: {{ .Values.ollama.model | quote }}
            - name: OLLAMA_STARTUP_TIMEOUT_SECONDS
              value: {{ .Values.ollama.startupTimeoutSeconds | quote }}
            {{- if .Values.persistence.enabled }}
            - name: HOME
              value: {{ include "agent-sec-sidecar.ollamaHomePath" . | quote }}
            - name: OLLAMA_MODELS
              value: {{ include "agent-sec-sidecar.ollamaModelsPath" . | quote }}
            {{- else }}
            - name: HOME
              value: /tmp/ollama-home
            - name: OLLAMA_MODELS
              value: /tmp/ollama-models
            {{- end }}
            {{- with .Values.ollama.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.ollama.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          {{- end }}
          {{- if .Values.ollama.probes.startup.enabled }}
          startupProbe:
            exec:
              command:
                - ollama
                - list
            initialDelaySeconds: {{ .Values.ollama.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.ollama.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.ollama.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.ollama.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.ollama.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - ollama
                - show
                - {{ .Values.ollama.model | quote }}
            initialDelaySeconds: {{ .Values.ollama.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.ollama.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.ollama.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.ollama.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.ollama.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - ollama
                - list
            initialDelaySeconds: {{ .Values.ollama.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.ollama.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.ollama.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.ollama.probes.liveness.failureThreshold }}
          {{- end }}
        {{- end }}
      volumes:
        - name: runtime
          {{- if eq .Values.runtime.volume.type "emptyDir" }}
          emptyDir:
            {{- with .Values.runtime.volume.emptyDir.medium }}
            medium: {{ . | quote }}
            {{- end }}
            {{- with .Values.runtime.volume.emptyDir.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- end }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "agent-sec-sidecar.runtimeClaimName" . }}
          {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "agent-sec-sidecar.dataClaimName" . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
