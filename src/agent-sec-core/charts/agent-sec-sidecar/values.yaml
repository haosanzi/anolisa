replicaCount: 1

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

modelService:
  backend: ollama
  baseUrl: http://localhost:11434
  timeoutSeconds: 30

cli:
  image:
    repository: jinli-acs-registry.cn-hangzhou.cr.aliyuncs.com/acs/agent-sec-qodercli
    tag: "0.10.2"
    pullPolicy: IfNotPresent
  # Qoder CLI is an interactive foreground TUI, so keep stdin and a TTY open.
  stdin: true
  tty: true
  command: []
  args: []
  qoder:
    persistentPaths:
      # Qoder settings, sessions, memories, and workspace data must survive Pod
      # replacement, so place them on the data PVC.
      enabled: true
      configRelativePath: qoder-config
      workspaceRelativePath: qoder-workspace
  extraEnv:
    - name: CODE_SCANNER_MODE
      value: "deny"
    - name: PROMPT_SCANNER_MODE
      value: "deny"
    - name: PROMPT_SCANNER_TIMEOUT
      value: "150"
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

daemon:
  image:
    repository: jinli-acs-registry.cn-hangzhou.cr.aliyuncs.com/acs/agent-sec-daemon
    tag: "0.10.1"
    pullPolicy: IfNotPresent
  command: []
  args: []
  extraEnv: []
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  probes:
    startup:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

ollama:
  enabled: true
  image:
    repository: jinli-acs-registry.cn-hangzhou.cr.aliyuncs.com/acs/agent-sec-ollama
    tag: "0.32.1"
    pullPolicy: IfNotPresent
  model: modelscope.cn/ANOLISA/Qwen3Guard-Gen-0.6B-GGUF
  host: 127.0.0.1:11434
  keepAlive: "-1"
  # Quantized KV cache keeps the model's 32K context within the default
  # 2-vCPU/4-GiB ACS Pod. Ollama requires Flash Attention for KV quantization.
  flashAttention: true
  kvCacheType: q4_0
  startupTimeoutSeconds: 60
  persistentPaths:
    homeRelativePath: ollama-home
    modelsRelativePath: ollama-models
  extraEnv: []
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  probes:
    startup:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

runtime:
  mountPath: /run/agent-sec
  socketRelativePath: runtime/daemon.sock
  volume:
    # emptyDir is the correct default for a Pod-scoped Unix socket. Set this
    # to persistentVolumeClaim only when a platform policy requires a PVC.
    type: emptyDir
    emptyDir:
      medium: ""
      sizeLimit: 16Mi
    persistentVolumeClaim:
      create: true
      existingClaim: ""
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      annotations: {}

persistence:
  # CLI and daemon use <mountPath>/<dataRelativePath>/<runAsUser> as
  # AGENT_SEC_DATA_DIR. The UID level keeps data created by different runtime
  # users isolated during UID migration.
  enabled: true
  mountPath: /var/lib/agent-sec/persistent
  dataRelativePath: events
  persistentVolumeClaim:
    # existingClaim takes precedence over create. Leave it empty to let the
    # chart create a PVC, or set it to mount a pre-provisioned PVC.
    create: true
    existingClaim: ""
    storageClassName: alicloud-disk-ssd
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 20001
  runAsGroup: 20001
  fsGroup: 20001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

automountServiceAccountToken: false
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
