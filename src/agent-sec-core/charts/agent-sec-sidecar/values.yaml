replicaCount: 1

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

modelService:
  backend: ollama
  baseUrl: http://localhost:11434
  timeoutSeconds: 30

cli:
  image:
    repository: jinli-acs-registry.cn-hangzhou.cr.aliyuncs.com/acs/agent-sec-qodercli
    tag: "0.10.2"
    pullPolicy: IfNotPresent
  # Qoder CLI is an interactive foreground TUI, so keep stdin and a TTY open.
  stdin: true
  tty: true
  command: []
  args: []
  qoder:
    persistentPaths:
      # Qoder settings, sessions, memories, and workspace data must survive Pod
      # replacement, so place them on the data PVC.
      enabled: true
      configRelativePath: qoder-config
      workspaceRelativePath: qoder-workspace
  extraEnv:
    - name: CODE_SCANNER_MODE
      value: "deny"
    - name: PROMPT_SCANNER_MODE
      value: "deny"
    - name: PROMPT_SCANNER_TIMEOUT
      value: "150"
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false

daemon:
  image:
    repository: jinli-acs-registry.cn-hangzhou.cr.aliyuncs.com/acs/agent-sec-daemon
    tag: "0.10.1"
    pullPolicy: IfNotPresent
  command: []
  args: []
  extraEnv: []
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  probes:
    startup:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

ollama:
  enabled: true
  image:
    repository: jinli-acs-registry.cn-hangzhou.cr.aliyuncs.com/acs/agent-sec-ollama
    tag: "0.32.1"
    pullPolicy: IfNotPresent
  model: modelscope.cn/ANOLISA/Qwen3Guard-Gen-0.6B-GGUF
  host: 127.0.0.1:11434
  keepAlive: "-1"
  # The Ollama sidecar caps the model context at num_ctx=4096 (see
  # entrypoint-ollama.sh) and quantises the KV cache to q8_0 to keep the
  # container memory footprint down.  Flash Attention is required by Ollama
  # for a quantised cache and therefore stays enabled.  Measured on a 4-vCPU
  # ACS Pod with:
  #   kubectl top pod -n agent-sec \
  #     "$(kubectl get po -n agent-sec -l app.kubernetes.io/instance=agent-sec \
  #       -o jsonpath='{.items[0].metadata.name}')" --containers
  # the ollama container sits at ~836Mi with q8_0 versus ~1500Mi with f16.
  # Do not size this from the `llama_kv_cache: size = ...` line in the server
  # log: that covers the KV cache alone (238Mi at q8_0), not the model
  # weights and compute buffers the container also pays for.  This trades
  # latency for memory: a 1.9k-token scan took 24s with q8_0 versus 7.4s
  # with f16, because llama.cpp falls back to an unoptimised quantised
  # attention kernel whose per-token cost grows with context length.
  flashAttention: true
  kvCacheType: q8_0
  startupTimeoutSeconds: 60
  persistentPaths:
    homeRelativePath: ollama-home
    modelsRelativePath: ollama-models
  extraEnv: []
  resources: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
  probes:
    startup:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      enabled: true
      initialDelaySeconds: 1
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 3
    liveness:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

runtime:
  mountPath: /run/agent-sec
  socketRelativePath: runtime/daemon.sock
  volume:
    # emptyDir is the correct default for a Pod-scoped Unix socket. Set this
    # to persistentVolumeClaim only when a platform policy requires a PVC.
    type: emptyDir
    emptyDir:
      medium: ""
      sizeLimit: 16Mi
    persistentVolumeClaim:
      create: true
      existingClaim: ""
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 1Gi
      annotations: {}

persistence:
  # CLI and daemon use <mountPath>/<dataRelativePath>/<runAsUser> as
  # AGENT_SEC_DATA_DIR. The UID level keeps data created by different runtime
  # users isolated during UID migration.
  enabled: true
  mountPath: /var/lib/agent-sec/persistent
  dataRelativePath: events
  persistentVolumeClaim:
    # existingClaim takes precedence over create. Leave it empty to let the
    # chart create a PVC, or set it to mount a pre-provisioned PVC.
    create: true
    existingClaim: ""
    storageClassName: alicloud-disk-ssd
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}

podAnnotations:
  alibabacloud.com/pod-required-spec: "4-8Gi"
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 20001
  runAsGroup: 20001
  fsGroup: 20001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

automountServiceAccountToken: false
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
